{#- Account actions for the header (phases 2-3). The header only includes this partial, so layout changes there keep them. -#}
<div class="auth-nav">
  {% if user %}
  <a class="auth-nav-link" href="/account/history">{{ t('auth.nav.account') }}</a>
  <form class="auth-nav-form" action="/logout" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="auth-nav-link" type="submit">{{ t('auth.nav.logout') }}</button></form>
  {% else %}
  <a class="auth-nav-link" href="/login"{% if path == '/login' %} aria-current="page"{% endif %}>{{ t('auth.nav.login') }}</a>
  <a class="auth-nav-link" href="/register"{% if path == '/register' %} aria-current="page"{% endif %}>{{ t('auth.nav.register') }}</a>
  {% endif %}
</div>
