<header class="tl-header">
  <div class="tl-container tl-header-inner">
    <a class="tl-wordmark" href="/" aria-label="Tandau">{{ wordmark() }}</a>
    <details class="tl-mobile-language">
      <summary aria-label="{{ t('nav.language') }}: {{ {'ru':'Русский','kk':'Қазақша','en':'English'}[lang] }}">{{ {'ru':'RU','kk':'ҚАЗ','en':'EN'}[lang] }} <span aria-hidden="true">⌄</span></summary>
      {% include 'partials/lang_switch.html' %}
    </details>
    <button class="tl-menu-toggle" type="button" aria-controls="site-nav" aria-expanded="false" aria-label="{{ t('nav.menu') }}" data-open-label="{{ t('nav.menu') }}" data-close-label="{{ t('nav.close_menu') }}"><span></span><span></span></button>
    <nav id="site-nav" class="tl-site-nav" aria-label="{{ t('nav.menu') }}">
      <div class="tl-desktop-nav">
        <a href="/#how">{{ t('nav.how') }}</a>
        <a href="/#categories">{{ t('nav.categories') }}</a>
        <a href="/#workspace">{{ t('nav.example') }}</a>
      </div>
      <div class="tl-header-actions">
        {% include 'partials/lang_switch.html' %}
        {% include 'partials/auth_nav.html' %}
      </div>
    </nav>
  </div>
</header>
